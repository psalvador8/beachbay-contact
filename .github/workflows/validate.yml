name: Terraform and Lambda validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: lambda/package-lock.json
      - name: Package Lambda and check JavaScript syntax
        run: |
          ./package_lambda.sh
          node --check lambda/index.js
      - name: Normalize Terraform formatting for validation
        run: terraform fmt -recursive infrastructure
      - name: Initialize Terraform without remote backend
        run: terraform -chdir=infrastructure init -backend=false -input=false
      - name: Validate Terraform configuration
        run: terraform -chdir=infrastructure validate
